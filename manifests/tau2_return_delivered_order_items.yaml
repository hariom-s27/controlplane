# P06 C2 — tau2-bench retail domain, tool: return_delivered_order_items.
# Shared rationale (ORDER_BELONGS_TO_CUSTOMER exclusion, the decide.py
# _PREDICATE_FOR_KIND gap, the flat predicate_key choice): see
# manifests/tau2_cancel_pending_order.yaml's header comment in full.
#
# tau2 business rule mirrored (tools.py, return_delivered_order_items):
# "if order.status != 'delivered': raise ValueError('...order is not
# delivered...')" — a strict "delivered" check, same form as exchange's.
manifest_id: tau2-retail-return_delivered_order_items-v1
schema_version: 1

tool: return_delivered_order_items
predicate_graph: graphs/tau2_return_delivered_order_items.json

compensation:
  action: null                    # tau2 exposes no "cancel return" tool
  compensability: partially        # commits the order to a return process; no immediate money movement observed in tools.py, but not trivially undone via tau2's own tool surface

risk_tier_default: 2               # delivered order, physical item return process initiated
fail_posture:
  tier_0: open
  tier_1: closed
  tier_2: closed

reliability_floor: corroborated

verdict_handling:
  UNVERIFIABLE: escalate
  SOURCE_UNRELIABLE: escalate

evidence_retention_days: 2555

claim_bindings:
  - claim_kind: ORDER_STATUS_SUPPORTS_ACTION
    resolver: tau2_retail
    subject: action.order_id
    predicate_key: order_status
