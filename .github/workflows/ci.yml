name: ci

# ROUND-2 RELEASE CANDIDATE smoke gate. A green run means only "the
# configured checks below passed" — not "ControlPlane is production-ready",
# not "the research/benchmark findings are validated". See docs/ for those.
#
# Scope: this gate runs Product-01 (scripts/judge_demo.py), Product-02
# (product/judge_presentation.py + product/judge_views.py), Product-03
# (demo/web.py dashboard) and Product-04A (dashboard hardening) test
# suites, the P02 use-case-agnostic engine regression check, a
# deterministic offline demo smoke test, and a dashboard import / GET-/
# smoke test. It does NOT run `pytest tests/ -q` as a whole — the full
# suite has known pre-existing failures unrelated to these product layers
# (a stale pinned hash constant compared against the committed
# bench/gold_set.jsonl in test_evidence_ablation.py, stale doc-claim
# guards, and a torch/transformers-only test module that needs a ~600MB
# model download and is skipped everywhere offline). This workflow does
# not touch those tests.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  product-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No python_requires / pyproject range is declared anywhere in this
        # repo. 3.11/3.12 here is a CI configuration choice, not an
        # explicit repository compatibility declaration.
        python-version: ["3.11", "3.12"]
    env:
      CP_MODE: fixture
      CP_RECEIPT_SECRET: ci-test-secret-not-for-production
      CP_MODEL: Qwen/Qwen3-8B
      CP_MANIFEST: servicing
      CP_DEMO_DATE: "2026-08-14"
      CP_SEED: "20260814"
      CP_GATE: "on"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build deterministic SQLite stores
        run: python data/build_db.py

      - name: Product-01 tests (judge demo)
        run: python -m pytest tests/test_judge_demo.py -q

      - name: Product-02 tests (judge presentation / decision inspector)
        run: python -m pytest tests/test_product02_judge_presentation.py -q

      - name: Product-03 tests (dashboard)
        run: python -m pytest tests/test_product03_dashboard.py -q

      - name: Product-04A tests (dashboard hardening)
        run: python -m pytest tests/test_product04a_hardening.py -q

      - name: Engine must stay use-case-agnostic (P02 regression gate)
        run: python -m pytest tests/test_engine_is_use_case_agnostic.py -q

      - name: Deterministic offline demo smoke test
        run: python -m scripts.judge_demo

      - name: Dashboard import / GET-/ smoke test
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from demo.web import app
          client = TestClient(app)
          r = client.get('/')
          assert r.status_code == 200, r.status_code
          print('dashboard smoke OK:', r.status_code)
          "
